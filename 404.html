<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | PsyPhin</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <script>
    /* GitHub Pages addresses are case-sensitive. Send any spelling of these paths
       to the real one (e.g. /gp-weather/ or /Gp-Weather -> /GP-weather/).
       Keys are lowercase; values are the real path. Absolute paths: this page is
       served at whatever address was not found. */
    (function () {
      var ALIASES = { "gp-weather": "/GP-weather/" };
      var parts = location.pathname.split("/");
      var target = ALIASES[(parts[1] || "").toLowerCase()];
      if (target && "/" + parts[1] + "/" !== target) {
        location.replace(target + parts.slice(2).join("/") + location.search + location.hash);
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #040817; color: #eaf2ff;
           font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    a { color: #4cc9ff; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That address doesn't exist on PsyPhin.</p>
    <p><a href="/">Go to psyphin.co.za</a></p>
  </main>
</body>
</html>
