<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PsyPhin</title>
  <meta name="description" content="Projects and creations by PsyPhin.">
  <meta name="theme-color" content="#020203">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://psyphin.co.za/">
  <meta property="og:title" content="PsyPhin">
  <meta property="og:description" content="Projects and creations by PsyPhin.">
  <meta property="og:image" content="https://psyphin.co.za/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="favicon-192x192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header-inner">
      <!-- Brand mark: hidden at the top of the page, shown once you scroll (js/main.js adds body.scrolled) -->
      <a class="brand" href="index.html" aria-label="PsyPhin home"><img src="assets/img/brand-64.png" alt="" width="30" height="30"><span>PsyPhin</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#projects">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <picture>
        <source type="image/webp"
                srcset="assets/img/logo-480.webp 480w, assets/img/logo-800.webp 800w, assets/img/logo-1200.webp 1200w"
                sizes="(max-width: 860px) 90vw, 738px">
        <img class="hero-logo"
             src="assets/img/logo-800.jpg"
             srcset="assets/img/logo-480.jpg 480w, assets/img/logo-800.jpg 800w, assets/img/logo-1200.jpg 1200w"
             sizes="(max-width: 860px) 90vw, 738px"
             width="1200" height="655"
             alt="PsyPhin logo: a brushed-metal shield with a glowing circuit-board letter P"
             fetchpriority="high">
      </picture>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <!-- Cards are generated from /projects.js -->
      <div id="project-grid" class="grid"></div>
      <noscript><p class="empty">Enable JavaScript to see the project list.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> PsyPhin &middot; psyphin.co.za</p>
  </footer>

  <script src="projects.js"></script>
  <script src="js/main.js"></script>
  <!-- GoatCounter: cookie-free visitor stats at https://psyphin.goatcounter.com/ -->
  <script data-goatcounter="https://psyphin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
