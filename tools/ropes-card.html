<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<!-- Source of assets/img/projects/ropes-recovery-gear.jpg (the Ropes and Shackles card).
     Render at an 800x450 window, 2x scale (headless Edge/Chrome screenshot), then scale to 800x450 JPG. -->
<style>html,body{margin:0;background:#040817}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="glowA" cx="0.62" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.15" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#3fb6ff" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34405e"/>
      <stop offset="1" stop-color="#1b2440"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a96aa"/>
      <stop offset="0.45" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#7d899d"/>
    </linearGradient>
    <radialGradient id="steelHead" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c3ccd9"/>
      <stop offset="1" stop-color="#6d788c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="650">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="overTop"><rect x="0" y="0" width="800" height="225"/></clipPath>

    <!-- a bow shackle, ears at x=0 (y -35 and +35), bow to the right -->
    <path id="bowPath" d="M0,-35 C40,-41 65,-77 100,-75 C140,-73 162,-32 162,0 C162,32 140,73 100,75 C65,77 40,41 0,35"/>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="#040817"/>
  <rect width="800" height="450" fill="url(#glowA)"/>
  <rect width="800" height="450" fill="url(#glowB)"/>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- soft glow behind the gear -->
  <path d="M120,225 C300,225 420,225 500,225 C580,225 610,300 690,320" stroke="#4cc9ff" stroke-opacity="0.22" stroke-width="70" fill="none" filter="url(#glow)"/>

  <!-- recovery point: a steel plate bolted on, coming in from the left -->
  <g filter="url(#shadow)">
    <path d="M-20,183 H140 A42,42 0 0 1 140,267 H-20 Z" fill="url(#plate)" stroke="#78aaff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="38" cy="203" r="9" fill="#55617d" stroke="#0b1330" stroke-width="2"/>
    <circle cx="38" cy="247" r="9" fill="#55617d" stroke="#0b1330" stroke-width="2"/>
    <path d="M33,203 h10 M38,198 v10 M33,247 h10 M38,242 v10" stroke="#0b1330" stroke-width="2"/>
  </g>

  <!-- red bow shackle on the recovery point (bow to the right) -->
  <g transform="translate(140,225)">
    <g filter="url(#shadow)">
      <use href="#bowPath" fill="none" stroke="#7a1616" stroke-width="24" stroke-linecap="round"/>
      <use href="#bowPath" fill="none" stroke="#e0413a" stroke-width="19" stroke-linecap="round"/>
      <use href="#bowPath" fill="none" stroke="#ff9a8c" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" transform="translate(-2,-3)"/>
    </g>
  </g>

  <!-- the strap's eye, looped round the bow -->
  <g filter="url(#shadow)">
    <ellipse cx="362" cy="225" rx="62" ry="31" fill="none" stroke="#8c3a10" stroke-width="31"/>
    <ellipse cx="362" cy="225" rx="62" ry="31" fill="none" stroke="#ffc79a" stroke-opacity="0.75" stroke-width="25" stroke-dasharray="5 4"/>
    <ellipse cx="362" cy="225" rx="62" ry="31" fill="none" stroke="#f0863a" stroke-width="22"/>
    <ellipse cx="362" cy="225" rx="62" ry="31" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="22" stroke-dasharray="2 3"/>
  </g>

  <!-- the top of the bow passes over the strap -->
  <g clip-path="url(#overTop)">
    <g transform="translate(140,225)">
      <use href="#bowPath" fill="none" stroke="#7a1616" stroke-width="24" stroke-linecap="round"/>
      <use href="#bowPath" fill="none" stroke="#e0413a" stroke-width="19" stroke-linecap="round"/>
      <use href="#bowPath" fill="none" stroke="#ff9a8c" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" transform="translate(-2,-3)"/>
    </g>
  </g>

  <!-- ears and pin -->
  <g filter="url(#shadow)">
    <rect x="124" y="176" width="32" height="28" rx="9" fill="#c93630" stroke="#7a1616" stroke-width="2"/>
    <rect x="124" y="246" width="32" height="28" rx="9" fill="#c93630" stroke="#7a1616" stroke-width="2"/>
    <rect x="130" y="168" width="20" height="116" rx="6" fill="url(#steel)" stroke="#5d6880" stroke-width="1.5"/>
    <path d="M132,272 h16 M132,277 h16 M132,282 h16" stroke="#5d6880" stroke-width="1.5"/>
    <circle cx="140" cy="160" r="19" fill="url(#steelHead)" stroke="#5d6880" stroke-width="2"/>
    <circle cx="140" cy="160" r="6.5" fill="#0b1330"/>
  </g>

  <!-- main strap: sewn sleeve, then the strap running off to the right -->
  <g filter="url(#shadow)">
    <path d="M492,225 C575,225 605,300 690,320 C745,333 790,330 840,322" fill="none" stroke="#8c3a10" stroke-width="37"/>
    <path d="M492,225 C575,225 605,300 690,320 C745,333 790,330 840,322" fill="none" stroke="#ffc79a" stroke-opacity="0.75" stroke-width="31" stroke-dasharray="6 4"/>
    <path d="M492,225 C575,225 605,300 690,320 C745,333 790,330 840,322" fill="none" stroke="#f0863a" stroke-width="28"/>
    <path d="M492,225 C575,225 605,300 690,320 C745,333 790,330 840,322" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="28" stroke-dasharray="2 3"/>

    <rect x="410" y="204" width="96" height="42" rx="6" fill="#d96b25" stroke="#8c3a10" stroke-width="2"/>
    <!-- box stitch -->
    <rect x="418" y="211" width="80" height="28" rx="3" fill="none" stroke="#ffe0c2" stroke-opacity="0.8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M418,211 L498,239 M418,239 L498,211" stroke="#ffe0c2" stroke-opacity="0.8" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>

  <!-- rating tag on the strap -->
  <g transform="translate(560,246) rotate(28)">
    <rect x="-22" y="-12" width="44" height="24" rx="3" fill="#eaf2ff"/>
    <rect x="-22" y="-12" width="9" height="24" rx="2" fill="#2f6bff"/>
    <path d="M-8,-5 h24 M-8,0 h18 M-8,5 h22" stroke="#0b1330" stroke-width="2"/>
  </g>

  <!-- a loose galvanised bow shackle -->
  <g transform="translate(250,368) rotate(-14) scale(0.62)" filter="url(#shadow)">
    <use href="#bowPath" fill="none" stroke="#56627a" stroke-width="24" stroke-linecap="round"/>
    <use href="#bowPath" fill="none" stroke="#b9c4d4" stroke-width="19" stroke-linecap="round"/>
    <use href="#bowPath" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round" transform="translate(-2,-3)"/>
    <rect x="-16" y="-49" width="32" height="28" rx="9" fill="#a3afc2" stroke="#56627a" stroke-width="2"/>
    <rect x="-16" y="21" width="32" height="28" rx="9" fill="#a3afc2" stroke="#56627a" stroke-width="2"/>
    <rect x="-10" y="-57" width="20" height="116" rx="6" fill="url(#steel)" stroke="#56627a" stroke-width="1.5"/>
    <circle cx="0" cy="-65" r="19" fill="url(#steelHead)" stroke="#56627a" stroke-width="2"/>
    <circle cx="0" cy="-65" r="6.5" fill="#0b1330"/>
  </g>

  <!-- a soft shackle: a rope loop closed by a stopper knot -->
  <g transform="translate(655,118) rotate(-18)" filter="url(#shadow)">
    <path d="M-70,0 C-70,-38 -20,-46 25,-30 C55,-20 70,-8 70,0 C70,8 55,20 25,30 C-20,46 -70,38 -70,0 Z" fill="none" stroke="#0f3f66" stroke-width="17"/>
    <path d="M-70,0 C-70,-38 -20,-46 25,-30 C55,-20 70,-8 70,0 C70,8 55,20 25,30 C-20,46 -70,38 -70,0 Z" fill="none" stroke="#3fb8ff" stroke-width="13"/>
    <path d="M-70,0 C-70,-38 -20,-46 25,-30 C55,-20 70,-8 70,0 C70,8 55,20 25,30 C-20,46 -70,38 -70,0 Z" fill="none" stroke="#0b1330" stroke-opacity="0.28" stroke-width="13" stroke-dasharray="2 3"/>
    <path d="M70,0 C85,0 95,-6 108,-18" fill="none" stroke="#0f3f66" stroke-width="17" stroke-linecap="round"/>
    <path d="M70,0 C85,0 95,-6 108,-18" fill="none" stroke="#3fb8ff" stroke-width="13" stroke-linecap="round"/>
    <path d="M70,0 C85,0 95,-6 108,-18" fill="none" stroke="#0b1330" stroke-opacity="0.28" stroke-width="13" stroke-dasharray="2 3" stroke-linecap="round"/>
    <circle cx="74" cy="0" r="16" fill="#3fb8ff" stroke="#0f3f66" stroke-width="3"/>
    <path d="M62,-8 Q74,4 86,-8 M62,8 Q74,-4 86,8 M66,-12 Q74,0 66,12 M82,-12 Q74,0 82,12" fill="none" stroke="#0f3f66" stroke-width="2.2"/>
  </g>
</svg>
</body></html>
