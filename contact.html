<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · PsyPhin</title>
  <meta name="description" content="Get in touch with PsyPhin.">
  <meta name="theme-color" content="#020203">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://psyphin.co.za/contact.html">
  <meta property="og:title" content="Contact · PsyPhin">
  <meta property="og:description" content="Get in touch with PsyPhin.">
  <meta property="og:image" content="https://psyphin.co.za/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header-inner">
      <!-- Brand mark: hidden at the top of the page, shown once you scroll (js/main.js adds body.scrolled) -->
      <a class="brand" href="index.html" aria-label="PsyPhin home"><img src="assets/img/brand-64.png" alt="" width="30" height="30"><span>PsyPhin</span></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html#projects">Projects</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero hero--compact">
      <a href="index.html" aria-label="PsyPhin home">
        <picture>
          <source type="image/webp"
                  srcset="assets/img/logo-480.webp 480w, assets/img/logo-800.webp 800w"
                  sizes="(max-width: 480px) 100vw, 440px">
          <img class="hero-logo"
               src="assets/img/logo-480.jpg"
               srcset="assets/img/logo-480.jpg 480w, assets/img/logo-800.jpg 800w"
               sizes="(max-width: 480px) 100vw, 440px"
               width="1200" height="655"
               alt="PsyPhin logo">
        </picture>
      </a>
    </section>

    <section class="section">
      <h2>Contact</h2>
      <div class="contact-card">
        <!-- Edit this line if you want different wording -->
        <p>Questions, ideas or feedback about any of the projects? Send an email:</p>
        <!-- The address is assembled by js/main.js from data-user + data-domain, so it never
             appears as a plain "name@domain" in the HTML for spam bots to harvest. -->
        <a class="contact-email" data-user="info" data-domain="psyphin.co.za" data-email="text">info [at] psyphin.co.za</a>
        <div class="contact-actions">
          <a class="button button--plain" data-user="info" data-domain="psyphin.co.za">Send an email</a>
          <button class="button button--plain button--secondary" type="button" data-user="info" data-domain="psyphin.co.za">Copy address</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> PsyPhin &middot; psyphin.co.za</p>
  </footer>

  <script src="js/main.js"></script>
  <!-- GoatCounter: cookie-free visitor stats at https://psyphin.goatcounter.com/ -->
  <script data-goatcounter="https://psyphin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
